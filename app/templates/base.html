<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title if title else 'TankFlix' }}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="/static/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <h1><a href="/">TankFlix</a></h1>
    <nav aria-label="Hauptnavigation">
      <a href="/?fuel=e5" {% if fuel is defined and fuel == 'e5' %}aria-current="page"{% endif %}>Benzin (E5)</a>
      <a href="/?fuel=diesel" {% if fuel is defined and fuel == 'diesel' %}aria-current="page"{% endif %}>Diesel</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
